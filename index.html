    <meta charset="UTF-8">

<body>

    <!-- html form -->

<form action="">
<div class="row mt-3">
    <div class="col-2"></div>
    <div class="col-8">

        <div class="card text-center">
            <div class="card-header text-start">
                <h3>Payment form example</h3>
            </div>
            <div class="card-body">
                <!-- field to display error msg -->
                
                <div class="alert alert-danger text-start" role="alert">
                    Some fields are missing
                </div>

                <!-- card, cvc and amount row -->
                 <div class="row">
                    <div class="col-6">
                        <div class="mb-3 text-start ">
                            <label for="card-number" class="form-label">Card #</label>
                            <input type="text" class="form-control" id="card-number" placeholder="XXXXXXXXXXXXXXXX" minlength="13" maxlength="16" required> 
                        </div>
                    </div>
                    <div class="col-2">
                        <div class="mb-3 text-start ">
                            <label for="cvc-number" class="form-label">CVC #</label>
                            <input type="text" class="form-control" id="cvc-number" placeholder="0000" minlength="3" maxlength="4">
                        </div>
                    </div>
                    <div class="col-4 text-start">
                        <label for="amount" class="form-label">Amount</label>
                        <div class="input-group mb-3">
                            <span class="input-group-text">$</span>
                            <input type="text" class="form-control" id="amount" aria-label="amount" placeholder="Amount" minlength="1" maxlength="9">
                        </div>
                    </div>
                 </div>
                 <!-- first and last name row -->
                 <div class="row">
                    <div class="col-6">
                        <div class="mb-3 text-start ">
                            <label for="name" class="form-label">First Name</label>
                            <input type="text" class="form-control" id="name"  minlength="1" maxlength="3" required> 
                        </div>
                    </div>

                    <div class="col-6">
                        <div class="mb-3 text-start ">
                            <label for="last-name" class="form-label">Last Name</label>
                            <input type="text" class="form-control" id="last-name" minlength="1" maxlength="3"   required> 
                        </div>
                    </div>

                 </div>
                 <!-- city, state and postal code row -->
                 <div class="row">
                    <div class="col-6">
                        <div class="mb-3 text-start ">
                            <label for="city" class="form-label">City</label>
                            <input type="text" class="form-control" id="city" required> 
                        </div>
                    </div>
                    <div class="col-3">
                        <div class="mb-3 text-start ">
                            <label for="state" class="form-label">State</label>
                        <select class="form-select" aria-label="Default select example">
                            <option selected>Pick a state</option>
                            <option value="Florida">Florida</option>
                            <option value="Arizona">Arizona</option>
                            <option value="California">California</option>
                        </select>
                        </div>

                    </div>
                    <div class="col-3">
                        <div class="mb-3 text-start ">
                            <label for="postal-code" class="form-label">Postal code</label>
                            <input type="text" class="form-control" id="postal-code" required> 
                        </div>
                    </div>
                 </div>
                 <!-- icons and msg row -->
                 <div class="row">
                    <div class="col-6 text-start">
                        <label for="postal-code" class="form-label me-auto">We accept:</label>
